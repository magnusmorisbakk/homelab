services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/hdd/docker-volumes/monitoring/grafana:/var/lib/grafana
    environment:
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=authentik
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email entitlements
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://192.168.0.179:9001/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://192.168.0.179:9001/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://192.168.0.179:9001/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=http://192.168.0.179:9001/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'
      - GF_SERVER_ROOT_URL=http://192.168.0.179:3000/
      - GF_AUTH_GENERIC_OAUTH_REDIRECT_URI=http://192.168.0.179:3000/login/generic_oauth
      - GF_AUTH_DISABLE_LOGIN_FORM=true