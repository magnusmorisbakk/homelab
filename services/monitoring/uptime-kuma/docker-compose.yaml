services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    user: "1000:1000"
    group_add:
      - "982" # Allows uptime kuma to see other containers
    cap_add:
      - NET_RAW # Allows non root ICMP pinging
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      # Persistent storage on 4TB HDD
      - /mnt/hdd/docker-volumes/monitoring/uptime-kuma:/app/data
      # Host Docker socket for container status monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Oslo
      - UMASK=0022
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/ || exit 1"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - auth-net

networks:
  auth-net:
    external: tru